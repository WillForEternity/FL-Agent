# SPDX-License-Identifier: Apache-2.0
# Lint and test everything that doesn't need FL Studio. (Plugin builds need
# macOS and download JUCE; run scripts/build-plugins.sh locally.)
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fl-studio-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --python 3.12
      - name: Lint
        run: uv run ruff check src tests ../scripts ../examples
      - name: Shell syntax
        run: for f in ../scripts/*.sh; do bash -n "$f"; done
      - name: Tests
        run: uv run pytest -q
      - name: Tool reference is current
        run: uv run python ../scripts/generate_tool_reference.py --check
